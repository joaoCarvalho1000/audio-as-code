[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "audio-as-code"
version = "0.3.0"
description = "An agent-friendly music score, composition toolkit, and offline renderer."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Audio as Code contributors" }]
keywords = ["music", "procedural-audio", "synthesis", "midi", "composition"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.24,<3", "pydantic>=2.7,<3", "mido>=1.3,<2"]

[project.optional-dependencies]
loudness = ["pyloudnorm>=0.2,<0.3"]

[project.urls]
Homepage = "https://audioascode.com"
Repository = "https://github.com/joaoCarvalho1000/audio-as-code"
Issues = "https://github.com/joaoCarvalho1000/audio-as-code/issues"

[project.scripts]
aac = "audio_as_code.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "jsonschema>=4.23,<5"]

[tool.hatch.build]
# Defense in depth: apply the same private/generated-file rules to both artifacts.
exclude = [
    "**/.env*", "**/.agents/**", "**/.codex/**", "**/.impeccable/**", "**/.wrangler/**",
    "**/.git/**", "**/.venv/**", "**/node_modules/**", "**/%SystemDrive%/**",
    "**/.claude/**", "**/.orca/**", "**/.cursor/**", "**/.idea/**", "**/.vscode/**",
    "**/.internal/**", "/docs/internal/**", "**/.dev.vars*",
    "**/__pycache__/**", "**/.pytest_cache/**", "**/.ruff_cache/**",
    "**/.mypy_cache/**", "**/.hypothesis/**", "**/.tox/**", "**/.nox/**",
    "**/playwright-report/**", "**/test-results/**", "**/htmlcov/**", "**/.coverage*",
    "**/output/**", "**/dist/**", "**/build/**", "**/*.egg-info/**",
    "**/*.py[cod]", "**/*.log", "**/*.key", "**/*.pem", "**/credentials*",
    "**/*.wav", "**/*.mp3", "**/*.mid", "**/*.midi",
    "**/*.p12", "**/*.pfx", "**/*.prof",
    "**/DESIGN.md", "**/PRODUCT.md", "**/PLAN.md", "**/HANDOFF.md", "**/SESSION.md",
    "**/NOTES.md", "**/PROGRESS.md", "**/CHECKPOINT.md", "**/TASKS.md",
    "/docs/instrument-browser-brief.md", "/docs/instrument-refinement.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/audio_as_code"]

[tool.hatch.build.targets.sdist]
# Ship the portable project, never workstation state or generated output.
only-include = [
    "src", "tests", "examples", "docs", "schemas", "skills", "web", ".github",
    "README.md", "LICENSE", "CONTRIBUTING.md", "AGENTS.md",
    "CHANGELOG.md", "SECURITY.md", ".gitignore", "pyproject.toml", "uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
